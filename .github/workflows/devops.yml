    - name: 🔐 Login a GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 🏗️ Construir imagen Docker
      run: |
        docker build -t ghcr.io/${{ github.actor }}/javier:1.0.1 .
        docker tag ghcr.io/${{ github.actor }}/javier:1.0.1 ghcr.io/${{ github.actor }}/javier:latest

    - name: 🚀 Subir imagen a GitHub Container Registry
      run: |
        docker push ghcr.io/${{ github.actor }}/javier:1.0.1
        docker push ghcr.io/${{ github.actor }}/javier:latest
