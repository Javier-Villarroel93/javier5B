name: DevOps Docker CI/CD - Javier

on:
  push:
    branches: [ javier ]
  pull_request:
    branches: [ javier ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: javier
      IMAGE_VERSION: 1.0.1
      APP_PORT: 5000

    steps:
    - name: 🧾 Checkout del código
      uses: actions/checkout@v4

    - name: ⚙️ Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: 📦 Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        else
          echo "No se encontró requirements.txt, continuando..."
        fi

    - name: 🧪 Ejecutar pruebas básicas
      run: |
        python - <<'PY'
        try:
            import flask
            print("✅ Flask instalado correctamente.")
        except Exception as e:
            print("⚠️ Advertencia:", e)
        PY

    - name: 🔐 Login a GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 🏗️ Construir imagen Docker
      run: |
        docker build -t ghcr.io/${{ github.actor }}/${IMAGE_NAME}:${IMAGE_VERSION} .
        docker tag ghcr.io/${{ github.actor }}/${IMAGE_NAME}:${IMAGE_VERSION} ghcr.io/${{ github.actor }}/${IMAGE_NAME}:latest

    - name: 🚀 Subir imagen a GitHub Container Registry
      run: |
        docker push ghcr.io/${{ github.actor }}/${IMAGE_NAME}:${IMAGE_VERSION}
        docker push ghcr.io/${{ github.actor }}/${IMAGE_NAME}:latest

    - name: 🔎 Verificar imagen creada
      run: docker images | grep "${IMAGE_NAME}"

    - name: 🧩 Ejecutar contenedor de prueba
      run: |
        docker run -d --name test-container -p ${APP_PORT}:${APP_PORT} ghcr.io/${{ github.actor }}/${IMAGE_NAME}:${IMAGE_VERSION}
        sleep 5
        curl -f http://localhost:${APP_PORT} || (docker logs test-container && exit 1)
        docker logs test-container
        docker rm -f test-container

    - name: ✅ Resumen del build
      run: |
        echo "✅ Build completado exitosamente"
        echo "📦 Imagen: ghcr.io/${{ github.actor }}/${IMAGE_NAME}:${IMAGE_VERSION}"
        echo "👤 Autor: ${{ github.actor }}"
        echo "🐳 Imagen publicada en GitHub Container Registry (GHCR)"
