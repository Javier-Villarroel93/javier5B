name: DevOps Docker CI/CD - Javier

on:
  push:
    branches: [ javier ]
  pull_request:
    branches: [ javier ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v3
    
    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Ejecutar tests de la aplicación
      run: |
        python -c "import flask; print('Flask instalado correctamente')"
    
    - name: Login a Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Construir imagen Docker
      run: |
        docker build -t javier:1.0.1 .
        docker tag javier:1.0.1 ${{ secrets.DOCKER_USERNAME }}/javier:1.0.1
        docker tag javier:1.0.1 ${{ secrets.DOCKER_USERNAME }}/javier:latest
    
    - name: Push imagen a Docker Hub
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/javier:1.0.1
        docker push ${{ secrets.DOCKER_USERNAME }}/javier:latest
    
    - name: Verificar imagen creada
      run: |
        docker images | grep javier
    
    - name: Ejecutar contenedor de prueba
      run: |
        docker run -d --name test-container -p 5000:5000 javier:1.0.1
        sleep 5
        curl http://localhost:5000 || exit 1
        docker logs test-container
        docker stop test-container
        docker rm test-container
    
    - name: Resumen del build
      run: |
        echo "✅ Build completado exitosamente"
        echo "📦 Imagen: javier:1.0.1"
        echo "👤 Autor: Javier"
        echo "🐳 Imagen publicada en Docker Hub"
